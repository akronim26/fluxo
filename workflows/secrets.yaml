# ==========================================================================
# CRE SECRETS FILE — Brizo
# ==========================================================================
# Maps the secret IDs the workflows request with `runtime.getSecret({ id })` to
# environment variable names. Values live only in `.env` (gitignored) for
# simulation, or in the Vault DON after `cre secrets create` for a deployment.
# Never put a value in this file.
secretsNames:
    MODEL_API_KEY:
        - SECRET_MODEL_API_KEY
    ENCLAVE_BOX_SK:
        - SECRET_ENCLAVE_BOX_SK
